[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "super-speech"
version = "0.7.4"
description = "Local Kokoro speech engine for desktop and headless use"
requires-python = ">=3.11,<3.14"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
super-speech-engine = "super_speech_engine:cli"

[tool.setuptools]
py-modules = [
    "super_speech_engine",
    "pauseable_audio",
    "speechicle_identity",
    "mutation_protocol",
    "timeline_storage",
    "file_lock",
    "inbox_listener",
    "engine_control",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-runtime.txt"] }
