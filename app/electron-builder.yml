appId: com.reasonmethis.superspeech
productName: Super Speech
copyright: Copyright (c) 2026 Dmitriy Vasilyuk
asar: true
directories:
  output: release/${version}
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: build/tray-icon.ico
    to: assets/tray-icon.ico
  - from: build/tray-iconTemplate.png
    to: assets/tray-iconTemplate.png
  - from: build/tray-iconTemplate@2x.png
    to: assets/tray-iconTemplate@2x.png
  - from: build-resources/engine
    to: engine
  - from: build-resources/models
    to: models
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../drainer-kokoro.py
    to: source/drainer-kokoro.py
  - from: ../pauseable_audio.py
    to: source/pauseable_audio.py
  - from: ../requirements-runtime.txt
    to: source/requirements-runtime.txt
  - from: scripts/build_engine.py
    to: source/build_engine.py
win:
  icon: build/icon.ico
  artifactName: Super-Speech-Win-${arch}-${version}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
mac:
  icon: build/icon.icns
  artifactName: Super-Speech-Mac-${arch}-${version}.${ext}
  category: public.app-category.utilities
  hardenedRuntime: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
npmRebuild: false
publish: null
