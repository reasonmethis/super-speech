<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Super Speech</title>
  </head>
  <body>
    <main class="app-shell">
      <header id="titlebar" class="titlebar">
        <div class="brand">
          <img class="brand-mark" src="/icon.png" alt="" />
          <h1>Super Speech</h1>
        </div>
        <div class="window-controls">
          <button
            id="settings-button"
            class="window-button"
            aria-label="Settings"
            aria-haspopup="dialog"
            popovertarget="settings-panel"
          >
            <svg class="settings-glyph" viewBox="0 0 16 16" aria-hidden="true">
              <path fill-rule="evenodd" d="M6.03 3.24 6.44 1.74h3.12l.41 1.5 1.35-.77 2.21 2.21-.77 1.35 1.5.41v3.12l-1.5.41.77 1.35-2.21 2.21-1.35-.77-.41 1.5H6.44l-.41-1.5-1.35.77-2.21-2.21.77-1.35-1.5-.41V6.44l1.5-.41-.77-1.35 2.21-2.21 1.35.77ZM9.85 8a1.85 1.85 0 1 0-3.7 0 1.85 1.85 0 1 0 3.7 0Z" />
            </svg>
          </button>
          <button id="minimize-button" class="window-button" aria-label="Minimize">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10" /></svg>
          </button>
          <button id="maximize-button" class="window-button" aria-label="Maximize">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path class="maximize-glyph" d="M3.5 3.5h9v9h-9z" />
              <path class="restore-glyph" d="M5.5 3.5h7v7m-2 2h-7v-7h7z" />
            </svg>
          </button>
          <button id="hide-button" class="window-button" aria-label="Hide to tray">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" /></svg>
          </button>
        </div>
      </header>

      <section id="playback-card" class="playback-card">
        <div class="status-line" role="status" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-label">Connecting</span>
        </div>

        <div class="playback-control">
          <div class="ambient-ring" aria-hidden="true">
            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>
          </div>
          <button id="playback-button" class="playback-button" aria-label="Preparing speech" disabled>
            <span id="playback-icon" class="playback-icon" aria-hidden="true"></span>
          </button>
        </div>

        <div
          id="playback-copy"
          class="playback-copy"
        >
          <h2 id="playback-title">Getting ready</h2>
          <p id="current-text" class="current-text">Reading the local speech engine...</p>
          <form id="speech-composer" class="speech-composer is-hidden">
            <textarea
              id="composer-text"
              rows="1"
              aria-label="Speech text"
            ></textarea>
            <div id="composer-actions" class="composer-actions is-hidden">
              <label class="composer-voice">
                <span>Voice</span>
                <select id="composer-voice" aria-label="Voice for new speech"></select>
              </label>
              <button id="composer-submit" type="submit">Add to Speechicles</button>
            </div>
          </form>
        </div>

        <div id="metadata-row" class="metadata-row">
          <span id="voice-pill" class="metadata-pill is-hidden">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a2 2 0 0 0-2 2v3a2 2 0 0 0 4 0v-3a2 2 0 0 0-2-2Z"/><path d="M3.8 7.2a4.2 4.2 0 0 0 8.4 0M8 11.4v2.1M5.8 13.5h4.4"/></svg>
            <span id="voice-label"></span>
          </span>
          <span id="source-pill" class="metadata-pill is-hidden">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="5" r="2"/><circle cx="11" cy="11" r="2"/><path d="m6.5 6.5 3 3"/></svg>
            <span id="source-label"></span>
          </span>
        </div>
      </section>

      <section class="timeline-section">
        <div class="section-heading">
          <h2 id="speech-heading">Speechicles</h2>
          <button id="clear-queue-button" class="clear-queue-button is-hidden" type="button">Clear all</button>
        </div>
        <div id="speechicle-list" class="speechicle-list" tabindex="-1" role="region" aria-labelledby="speech-heading"></div>
        <div id="command-status" class="sr-only" role="status" aria-live="polite"></div>
      </section>

      <footer>
        <span>(C) 2026 Dmitriy Vasilyuk</span>
        <span id="version-label">App -- | Engine --</span>
      </footer>
    </main>

    <div id="settings-panel" class="settings-panel" role="dialog" aria-label="Settings" popover>
      <span class="settings-title">Appearance</span>
      <div class="theme-options" role="group" aria-label="Color theme">
        <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      </div>
      <span class="settings-title settings-section-title">Voices</span>
      <label class="settings-checkbox">
        <input id="extra-voices-toggle" type="checkbox">
        <span>Allow extra voices</span>
      </label>
    </div>

    <div
      id="queue-action-menu"
      class="queue-action-menu"
      role="dialog"
      aria-label="Speech actions"
      hidden
    ></div>

    <div
      id="voice-menu"
      class="voice-menu"
      role="listbox"
      aria-label="Choose voice"
      hidden
    ></div>

    <dialog
      id="inbox-reply-dialog"
      class="inbox-reply-dialog"
      aria-labelledby="inbox-reply-title"
    >
      <form id="inbox-reply-form">
        <div class="inbox-reply-heading">
          <h2 id="inbox-reply-title">Reply to agent</h2>
          <button id="inbox-reply-close" type="button" aria-label="Close">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8m0-8-8 8" />
            </svg>
          </button>
        </div>
        <textarea
          id="inbox-reply-text"
          rows="4"
          aria-label="Reply"
          placeholder="Write a reply"
          required
        ></textarea>
        <div id="inbox-reply-status" class="inbox-reply-status" role="status"></div>
        <div class="inbox-reply-actions">
          <button id="inbox-reply-cancel" type="button">Cancel</button>
          <button id="inbox-reply-submit" type="submit">Send</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
